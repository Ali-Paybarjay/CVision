<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The CVision icon, Tick V (docs/brand.md › Logo). Lagoon and Night when the browser is dark. -->
  <style>
    .tile { fill: #167480; }
    .glyph { fill: none; stroke: #FFFFFF; stroke-width: 11; }
    .tick { stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #42B9C3; }
      .glyph { stroke: #0B1724; }
    }
  </style>
  <rect class="tile" width="100" height="100" rx="23"/>
  <path class="glyph" d="M49 38A17 17 0 1 0 49 62"/>
  <path class="glyph tick" d="M56 50 64 61 80 37"/>
</svg>
