# Lean CI (CLAUDE.md, rule 11): push and PRs to main, manual runs, no docs-only runs.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: &docs-only
      - "docs/**"
      - "**/README.md"
      - "CLAUDE.md"
      - "AGENTS.md"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: *docs-only
  workflow_dispatch:

# A new run cancels the previous one for the same branch or PR.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end tests
    # Only on main, or on a PR labelled e2e.
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'e2e')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # No end-to-end suite yet; this runs it once a test:e2e script exists.
      - run: npm run test:e2e --if-present
